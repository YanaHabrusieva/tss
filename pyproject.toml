[project]
name = "tss"
version = "0.1.0"
description = "Test Scheduling Service — a job broker for hardware-in-the-loop test fleets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "YanaHabrusieva" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "rich>=13.9",
    # Already present via uvicorn[standard] for the server side of WS /v1/events;
    # declared explicitly because `tss watch` is a client of it too.
    "websockets>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[project.scripts]
tss = "tss.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tss"]
# `GET /` serves this out of the package, so a wheel without it is a 404 in
# front of an audience. Named explicitly rather than relying on the default
# include-everything-under-the-package behaviour.
artifacts = ["tss/api/static/index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# No test classes in this suite; without this, pytest tries to collect helper
# classes whose names start with "Test" (TestbedAgent) and warns.
python_classes = []
markers = [
    "concurrency: threaded races against real SQLite connections",
    "slow: seeded chaos runs — minutes, not milliseconds",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
