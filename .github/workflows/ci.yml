name: ci

# The gate is three things, in increasing order of what they cost and what they
# prove: style, then the unit and integration suites, then chaos. Chaos is the
# one that can actually catch a scheduler bug, so it runs on every push — a
# merge gate you skip when you are in a hurry is a merge gate you do not have.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          # Without this the cache key never changes and the cache is never
          # invalidated; with it, a dependency bump is a cache miss, which is
          # what a cache key is for.
          cache-dependency-glob: uv.lock

      # --frozen: install exactly what uv.lock says, and fail if pyproject.toml
      # has drifted from it. Resolving fresh on every run means an upstream
      # release can change what the gate tests with no commit in this repo —
      # the stale-schema problem one layer up.
      - run: uv sync --extra dev --frozen

      - name: lint
        run: |
          .venv/bin/python -m ruff check .
          .venv/bin/python -m ruff format --check .

      # -m "not slow" skips the seeded chaos runs inside pytest: the gate below
      # runs chaos across five seeds, and running it twice buys nothing but
      # minutes.
      - name: tests
        run: .venv/bin/python -m pytest -m "not slow"

      # The deliberately-wrong implementations must still fail. `just test-naive`
      # shows a human that they do, but every line of it is dash-prefixed, so it
      # exits 0 either way and proved nothing to CI. This asserts it: if a foil
      # ever passes, the tests written to catch that bug have lost their teeth
      # and the build says so.
      - name: foils (the tests still have teeth)
        run: .venv/bin/python -m pytest tests/test_foils.py -m slow

      # 15 agents x 2-4 devices, 100 jobs at 30% multi-device, 5 seeds.
      # Fails the build on any invariant violation, any job that never finished,
      # and any profile that did not fire — see RunReport.check_floors.
      - name: chaos (merge gate)
        run: .venv/bin/python -m tss.chaos.runner --agents 15 --jobs 100 --multi-pct 30 --seeds 5 --seed 1

      # A seed reproduces the workload and the fleet, NOT the interleaving — so a
      # red run that cannot be reproduced on the first replay still has to be
      # investigable. The runner dumps every event it recorded, named for the
      # seed; keep it, because the database it came from lived in a temporary
      # directory that is already gone.
      - name: keep the evidence from a red run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-events
          path: chaos-seed-*-events.jsonl
          if-no-files-found: ignore
          retention-days: 14
